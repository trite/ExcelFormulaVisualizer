name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*'    # Matches v0.1, v1.0, v1.2.3, etc.
      - 'v[0-9]*' # Matches v1, v2, v12, etc. (single number versions)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1, v1.0, v1.2.3)'
        required: true
        default: 'v0.1'
      description:
        description: 'Version description'
        required: false
        default: 'New release'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for tag info

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Determine deployment type and version
      - name: Determine deployment type
        id: deploy-type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=versioned" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "description=${{ github.event.inputs.description }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "type=versioned" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            # Try to get description from tag annotation, fallback to default
            TAG_MSG=$(git tag -l --format='%(contents:subject)' "$VERSION" 2>/dev/null || echo "")
            if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" == "$VERSION" ]; then
              TAG_MSG="Release $VERSION"
            fi
            echo "description=$TAG_MSG" >> $GITHUB_OUTPUT
          else
            echo "type=development" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
            echo "description=" >> $GITHUB_OUTPUT
          fi
          echo "Deployment type: $(cat $GITHUB_OUTPUT | grep type)"

      # For development builds (push to main without tag)
      - name: Build (development)
        if: steps.deploy-type.outputs.type == 'development'
        run: npm run build

      # For versioned releases (tag push or workflow dispatch)
      - name: Build (versioned release)
        if: steps.deploy-type.outputs.type == 'versioned'
        run: |
          VERSION="${{ steps.deploy-type.outputs.version }}"
          DESCRIPTION="${{ steps.deploy-type.outputs.description }}"
          npx tsx scripts/deploy-version.ts "$VERSION" "$DESCRIPTION"

      # Fetch existing versions.json from gh-pages to merge with new version
      - name: Fetch and merge versions.json
        if: steps.deploy-type.outputs.type == 'versioned'
        run: |
          # Try to fetch existing versions.json from deployed site
          curl -sS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/versions.json" -o existing-versions.json 2>/dev/null || echo '{"latest":"","versions":[]}' > existing-versions.json

          if [ -f "existing-versions.json" ] && [ -f "dist/versions.json" ]; then
            node -e "
              const fs = require('fs');
              let existing;
              try {
                existing = JSON.parse(fs.readFileSync('./existing-versions.json', 'utf-8'));
              } catch(e) {
                existing = { latest: '', versions: [] };
              }
              const newManifest = JSON.parse(fs.readFileSync('./dist/versions.json', 'utf-8'));
              const allVersions = new Map();
              // Add existing versions
              (existing.versions || []).forEach(v => allVersions.set(v.version, v));
              // Override with new versions
              (newManifest.versions || []).forEach(v => allVersions.set(v.version, v));
              // Sort using semantic versioning (newest first)
              const merged = {
                latest: newManifest.latest,
                versions: Array.from(allVersions.values()).sort((a, b) => {
                  const aParts = a.version.replace(/^v/, '').split('.').map(Number);
                  const bParts = b.version.replace(/^v/, '').split('.').map(Number);
                  for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
                    const aVal = aParts[i] || 0;
                    const bVal = bParts[i] || 0;
                    if (bVal !== aVal) return bVal - aVal;
                  }
                  return 0;
                })
              };
              fs.writeFileSync('./dist/versions.json', JSON.stringify(merged, null, 2));
              console.log('Merged versions.json:', JSON.stringify(merged, null, 2));
            "
          fi

      # Deploy using peaceiris/actions-gh-pages which properly maintains the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # keep_files preserves existing content in gh-pages branch (e.g., older versions)
          keep_files: ${{ steps.deploy-type.outputs.type == 'versioned' }}
          # Force push for development builds (non-versioned), incremental for versioned
          force_orphan: ${{ steps.deploy-type.outputs.type == 'development' }}
