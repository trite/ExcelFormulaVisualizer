name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*.*'    # Matches v0.1, v1.0, v1.2.3, etc.
      - 'v[0-9]*' # Matches v1, v2, v12, etc. (single number versions)
  workflow_dispatch:
    inputs:
      description:
        description: 'Release description'
        required: false
        default: 'New release'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine version info
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            # Try to get description from tag annotation
            TAG_MSG=$(git tag -l --format='%(contents:subject)' "$VERSION" 2>/dev/null || echo "")
            if [ -z "$TAG_MSG" ] || [ "$TAG_MSG" == "$VERSION" ]; then
              TAG_MSG="Release $VERSION"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "description=$TAG_MSG" >> $GITHUB_OUTPUT
          else
            # Manual workflow dispatch
            VERSION="manual-$(date +%Y%m%d-%H%M%S)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "description=${{ github.event.inputs.description }}" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: npm run build -- --base="/ExcelFormulaVisualizer/"
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.version.outputs.description }}
          draft: false
          prerelease: false
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Description:** ${{ steps.version.outputs.description }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Site:** https://${{ github.repository_owner }}.github.io/ExcelFormulaVisualizer/" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
