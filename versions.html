<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Formula Visualizer - All Versions</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #121212;
      color: #fff;
    }
    h1 { color: #90caf9; }
    .version {
      padding: 15px;
      margin: 10px 0;
      background: #1e1e1e;
      border-radius: 8px;
      border-left: 4px solid #90caf9;
    }
    .version.latest { border-left-color: #4caf50; }
    .version a {
      color: #90caf9;
      text-decoration: none;
      font-size: 1.2em;
      font-weight: bold;
    }
    .version a:hover { text-decoration: underline; }
    .version .meta {
      color: #888;
      font-size: 0.9em;
      margin-top: 5px;
    }
    .version .desc { margin-top: 8px; }
    .badge {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8em;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Excel Formula Visualizer</h1>
  <p>Select a version to use:</p>
  <div id="versions"></div>
  <script>
    fetch('./versions.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('versions');
        data.versions.forEach(v => {
          const isLatest = v.version === data.latest;
          container.innerHTML += `
            <div class="version ${isLatest ? 'latest' : ''}">
              <a href=".${v.path}">${v.version}</a>
              ${isLatest ? '<span class="badge">Latest</span>' : ''}
              <div class="meta">${v.date}</div>
              <div class="desc">${v.description}</div>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
